<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-labelledby="t d">
<title id="t">Precision versus bias</title>
<desc id="d">A two-by-two quadrant of bias against precision, showing that low bias with high variance is noisy but unbiased, while high bias with low variance is consistently wrong.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="700" height="380" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">Precision and bias are two different problems</text><line x1="200.0" y1="206.0" x2="594.0" y2="206.0" class="ax" stroke="#1f2328" stroke-width="1.6"/><line x1="400.0" y1="36.0" x2="400.0" y2="378.0" class="ax" stroke="#1f2328" stroke-width="1.6"/><text x="554.0" y="224.0" class="sm" text-anchor="end" fill="#1f2328" font-weight="600">bias  →</text><text x="410.0" y="62.0" class="sm" fill="#1f2328" font-weight="600">precision ↑</text><rect x="278.0" y="212.0" width="116.0" height="116.0" fill="#dcfce7" stroke="#1a7f37" stroke-width="1.6" opacity="1" rx="8"/><text x="336.0" y="262.0" class="sm" text-anchor="middle" fill="#1a7f37" font-weight="600">LOW BIAS, HIGH VAR</text><text x="336.0" y="280.0" class="sm" text-anchor="middle" fill="#57606a">noisy but</text><text x="336.0" y="296.0" class="sm" text-anchor="middle" fill="#57606a">right on average</text><rect x="406.0" y="212.0" width="116.0" height="116.0" fill="#fee2e2" stroke="#cf222e" stroke-width="1.6" opacity="1" rx="8"/><text x="464.0" y="262.0" class="sm" text-anchor="middle" fill="#cf222e" font-weight="600">HIGH BIAS, HIGH VAR</text><text x="464.0" y="280.0" class="sm" text-anchor="middle" fill="#57606a">noisy AND wrong</text><text x="464.0" y="296.0" class="sm" text-anchor="middle" fill="#57606a">— the dangerous one</text><rect x="278.0" y="84.0" width="116.0" height="116.0" fill="#dcfce7" stroke="#1a7f37" stroke-width="1.6" opacity="1" rx="8"/><text x="336.0" y="134.0" class="sm" text-anchor="middle" fill="#1a7f37" font-weight="600">LOW BIAS, LOW VAR</text><text x="336.0" y="152.0" class="sm" text-anchor="middle" fill="#57606a">consistent</text><text x="336.0" y="168.0" class="sm" text-anchor="middle" fill="#57606a">and right</text><rect x="406.0" y="84.0" width="116.0" height="116.0" fill="#fff4e5" stroke="#bc4c00" stroke-width="1.6" opacity="1" rx="8"/><text x="464.0" y="134.0" class="sm" text-anchor="middle" fill="#bc4c00" font-weight="600">HIGH BIAS, LOW VAR</text><text x="464.0" y="152.0" class="sm" text-anchor="middle" fill="#57606a">consistently</text><text x="464.0" y="168.0" class="sm" text-anchor="middle" fill="#57606a">wrong</text><text x="24.0" y="366.0" class="sm" font-weight="600">Random error shrinks with more data. Bias does not — it needs a better study design.</text>
</svg>
