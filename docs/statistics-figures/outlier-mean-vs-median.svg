<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 346" width="660" height="346" role="img" aria-labelledby="t d">
<title id="t">Mean versus median with an outlier</title>
<desc id="d">Five values including one extreme outlier. On a broken-axis dot plot the mean (430) lands far from the real cluster, while the median (40) sits inside it.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="660" height="346" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">The mean is destroyed by one value; the median is not</text><text x="24.0" y="48.0" class="sm">Five salaries (thousands):  30, 35, 40, 45, 2000</text><line x1="70.0" y1="104.0" x2="70.0" y2="246.0" class="ax"/><line x1="383.5" y1="104.0" x2="383.5" y2="246.0" class="ax"/><line x1="70.0" y1="246.0" x2="70.0" y2="252.0" class="ax" stroke="#57606a"/><text x="70.0" y="266.0" class="tick" text-anchor="middle">0</text><line x1="174.5" y1="246.0" x2="174.5" y2="252.0" class="ax" stroke="#57606a"/><text x="174.5" y="266.0" class="tick" text-anchor="middle">20</text><line x1="279.0" y1="246.0" x2="279.0" y2="252.0" class="ax" stroke="#57606a"/><text x="279.0" y="266.0" class="tick" text-anchor="middle">40</text><line x1="383.5" y1="246.0" x2="383.5" y2="252.0" class="ax" stroke="#57606a"/><text x="383.5" y="266.0" class="tick" text-anchor="middle">60</text><text x="226.8" y="286.0" class="sm" text-anchor="middle" fill="#57606a">zoomed in</text><line x1="383.5" y1="168.0" x2="383.5" y2="192.0" class="ax" stroke="#57606a"/><line x1="633.6" y1="168.0" x2="633.6" y2="192.0" class="ax" stroke="#57606a"/><line x1="383.5" y1="180.0" x2="633.6" y2="180.0" class="ax" stroke="#57606a"/><text x="508.5" y="202.0" class="sm" text-anchor="middle" fill="#57606a">the rest of the scale, squeezed</text><line x1="504.7" y1="246.0" x2="504.7" y2="252.0" class="ax" stroke="#57606a"/><text x="504.7" y="266.0" class="tick" text-anchor="middle">1,000</text><line x1="633.6" y1="246.0" x2="633.6" y2="252.0" class="ax" stroke="#57606a"/><text x="633.6" y="266.0" class="tick" text-anchor="middle">2,000</text><line x1="70.0" y1="246.0" x2="640.0" y2="246.0" class="ax"/><circle cx="226.8" cy="140.0" r="5.2" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><text x="226.8" y="124.0" class="sm" text-anchor="middle" fill="#0969da" font-weight="600">30</text><circle cx="252.9" cy="140.0" r="5.2" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><text x="252.9" y="124.0" class="sm" text-anchor="middle" fill="#0969da" font-weight="600">35</text><circle cx="279.0" cy="140.0" r="5.2" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><text x="279.0" y="124.0" class="sm" text-anchor="middle" fill="#0969da" font-weight="600">40</text><circle cx="305.1" cy="140.0" r="5.2" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><text x="305.1" y="124.0" class="sm" text-anchor="middle" fill="#0969da" font-weight="600">45</text><circle cx="633.6" cy="140.0" r="5.2" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><text x="633.6" y="124.0" class="sm" text-anchor="middle" fill="#cf222e" font-weight="600">2000</text><line x1="431.2" y1="246.0" x2="431.2" y2="258.0" class="ax" stroke="#cf222e" stroke-width="2.6"/><text x="431.2" y="276.0" class="sm" text-anchor="middle" fill="#cf222e" font-weight="600">mean = 430</text><line x1="279.0" y1="246.0" x2="279.0" y2="258.0" class="ax" stroke="#1a7f37" stroke-width="2.6"/><text x="279.0" y="276.0" class="sm" text-anchor="middle" fill="#1a7f37" font-weight="600">median = 40</text><text x="24.0" y="312.0" class="sm">The mean lands where nobody works. The median lands inside the real cluster.</text><text x="24.0" y="330.0" class="sm">Rule: report a centre and a spread together, and pick the centre your data can support.</text>
</svg>
