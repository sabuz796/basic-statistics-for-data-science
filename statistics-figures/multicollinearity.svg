<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 288" width="700" height="288" role="img" aria-labelledby="t d">
<title id="t">Multicollinearity</title>
<desc id="d">Two panels showing two predictor directions at sixty-two degrees (independent information) versus eight degrees apart (collinear, so the model cannot separate them).</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="700" height="288" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">Two predictors that say the same thing</text><text x="40.0" y="52.0" class="lbl" fill="#1a7f37" font-weight="600">GOOD — directions differ</text><line x1="40.0" y1="215.0" x2="310.0" y2="215.0" class="ax" stroke="#57606a"/><line x1="40.0" y1="215.0" x2="40.0" y2="80.0" class="ax" stroke="#57606a"/><line x1="180.0" y1="158.0" x2="104.8" y2="130.6" class="ax" stroke="#1a7f37" stroke-width="2.4"/><circle cx="104.8" cy="130.6" r="4.2" fill="#1a7f37" stroke="none" stroke-width="1" opacity="1"/><text x="92.8" y="120.6" class="sm" text-anchor="end" fill="#1a7f37" font-weight="600">x1</text><line x1="180.0" y1="158.0" x2="168.9" y2="78.8" class="ax" stroke="#1a7f37" stroke-width="2.4"/><circle cx="168.9" cy="78.8" r="4.2" fill="#1a7f37" stroke="none" stroke-width="1" opacity="1"/><text x="156.9" y="68.8" class="sm" text-anchor="end" fill="#1a7f37" font-weight="600">x2</text><circle cx="180.0" cy="158.0" r="3.0" fill="#1f2328" stroke="none" stroke-width="1" opacity="1"/><path d="M148.1,146.4 A34,34 0 0,1 175.3,124.3" fill="none" stroke="#bc4c00" stroke-width="2"/><text x="151.1" y="116.3" class="sm" text-anchor="middle" fill="#bc4c00" font-weight="600">62°</text><text x="40.0" y="238.0" class="sm" fill="#57606a">each predictor adds independent information</text><text x="370.0" y="52.0" class="lbl" fill="#cf222e" font-weight="600">BAD — nearly the same direction</text><line x1="370.0" y1="215.0" x2="640.0" y2="215.0" class="ax" stroke="#57606a"/><line x1="370.0" y1="215.0" x2="370.0" y2="80.0" class="ax" stroke="#57606a"/><line x1="510.0" y1="158.0" x2="434.8" y2="130.6" class="ax" stroke="#cf222e" stroke-width="2.4"/><circle cx="434.8" cy="130.6" r="4.2" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><text x="422.8" y="120.6" class="sm" text-anchor="end" fill="#cf222e" font-weight="600">x1</text><line x1="510.0" y1="158.0" x2="439.4" y2="120.4" class="ax" stroke="#cf222e" stroke-width="2.4"/><circle cx="439.4" cy="120.4" r="4.2" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><text x="427.4" y="110.4" class="sm" text-anchor="end" fill="#cf222e" font-weight="600">x2</text><circle cx="510.0" cy="158.0" r="3.0" fill="#1f2328" stroke="none" stroke-width="1" opacity="1"/><path d="M478.1,146.4 A34,34 0 0,1 480.0,142.0" fill="none" stroke="#bc4c00" stroke-width="2"/><text x="468.0" y="133.3" class="sm" text-anchor="middle" fill="#bc4c00" font-weight="600">8°</text><text x="370.0" y="238.0" class="sm" fill="#57606a">the model can no longer tell them apart</text><text x="24.0" y="274.0" class="sm">VIF = 1 / (1 - R²). VIF above 10 means the coefficients are unstable and can even flip sign.</text>
</svg>
