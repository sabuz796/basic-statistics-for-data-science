<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" role="img" aria-labelledby="t d">
<title id="t">Low vs high standard deviation</title>
<desc id="d">Two dartboards: one with shots tightly clustered at the centre (low SD), one with shots scattered widely (high SD).</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="620" height="250" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><circle cx="160.0" cy="118.0" r="72.0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" opacity="1"/><circle cx="160.0" cy="118.0" r="54.0" fill="#eef4ff" stroke="#d0d7de" stroke-width="1" opacity="1"/><circle cx="160.0" cy="118.0" r="36.0" fill="#d6e6ff" stroke="#d0d7de" stroke-width="1" opacity="1"/><circle cx="160.0" cy="118.0" r="18.0" fill="#b9d5ff" stroke="#d0d7de" stroke-width="1" opacity="1"/><circle cx="160.0" cy="118.0" r="72.0" fill="none" stroke="#d0d7de" stroke-width="1.4" opacity="1"/><line x1="160.0" y1="118.0" x2="157.2" y2="123.5" class="ax" stroke="#1a7f37" stroke-width="1" opacity=".65"/><circle cx="157.2" cy="123.5" r="3.6" fill="#1a7f37" stroke="none" stroke-width="1" opacity="1"/><line x1="160.0" y1="118.0" x2="167.7" y2="121.8" class="ax" stroke="#1a7f37" stroke-width="1" opacity=".65"/><circle cx="167.7" cy="121.8" r="3.6" fill="#1a7f37" stroke="none" stroke-width="1" opacity="1"/><line x1="160.0" y1="118.0" x2="161.6" y2="118.4" class="ax" stroke="#1a7f37" stroke-width="1" opacity=".65"/><circle cx="161.6" cy="118.4" r="3.6" fill="#1a7f37" stroke="none" stroke-width="1" opacity="1"/><line x1="160.0" y1="118.0" x2="158.1" y2="117.9" class="ax" stroke="#1a7f37" stroke-width="1" opacity=".65"/><circle cx="158.1" cy="117.9" r="3.6" fill="#1a7f37" stroke="none" stroke-width="1" opacity="1"/><line x1="160.0" y1="118.0" x2="157.5" y2="117.4" class="ax" stroke="#1a7f37" stroke-width="1" opacity=".65"/><circle cx="157.5" cy="117.4" r="3.6" fill="#1a7f37" stroke="none" stroke-width="1" opacity="1"/><line x1="160.0" y1="118.0" x2="160.9" y2="118.6" class="ax" stroke="#1a7f37" stroke-width="1" opacity=".65"/><circle cx="160.9" cy="118.6" r="3.6" fill="#1a7f37" stroke="none" stroke-width="1" opacity="1"/><line x1="160.0" y1="118.0" x2="158.5" y2="118.8" class="ax" stroke="#1a7f37" stroke-width="1" opacity=".65"/><circle cx="158.5" cy="118.8" r="3.6" fill="#1a7f37" stroke="none" stroke-width="1" opacity="1"/><text x="160.0" y="208.0" class="lbl" text-anchor="middle" font-weight="600">Low SD — consistent, accurate</text><circle cx="460.0" cy="118.0" r="72.0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" opacity="1"/><circle cx="460.0" cy="118.0" r="54.0" fill="#eef4ff" stroke="#d0d7de" stroke-width="1" opacity="1"/><circle cx="460.0" cy="118.0" r="36.0" fill="#d6e6ff" stroke="#d0d7de" stroke-width="1" opacity="1"/><circle cx="460.0" cy="118.0" r="18.0" fill="#b9d5ff" stroke="#d0d7de" stroke-width="1" opacity="1"/><circle cx="460.0" cy="118.0" r="72.0" fill="none" stroke="#d0d7de" stroke-width="1.4" opacity="1"/><line x1="460.0" y1="118.0" x2="458.0" y2="106.2" class="ax" stroke="#cf222e" stroke-width="1" opacity=".65"/><circle cx="458.0" cy="106.2" r="3.6" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><line x1="460.0" y1="118.0" x2="437.2" y2="94.5" class="ax" stroke="#cf222e" stroke-width="1" opacity=".65"/><circle cx="437.2" cy="94.5" r="3.6" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><line x1="460.0" y1="118.0" x2="468.9" y2="111.3" class="ax" stroke="#cf222e" stroke-width="1" opacity=".65"/><circle cx="468.9" cy="111.3" r="3.6" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><line x1="460.0" y1="118.0" x2="509.4" y2="110.6" class="ax" stroke="#cf222e" stroke-width="1" opacity=".65"/><circle cx="509.4" cy="110.6" r="3.6" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><line x1="460.0" y1="118.0" x2="456.3" y2="132.6" class="ax" stroke="#cf222e" stroke-width="1" opacity=".65"/><circle cx="456.3" cy="132.6" r="3.6" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><line x1="460.0" y1="118.0" x2="470.3" y2="131.2" class="ax" stroke="#cf222e" stroke-width="1" opacity=".65"/><circle cx="470.3" cy="131.2" r="3.6" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><line x1="460.0" y1="118.0" x2="466.2" y2="104.0" class="ax" stroke="#cf222e" stroke-width="1" opacity=".65"/><circle cx="466.2" cy="104.0" r="3.6" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><text x="460.0" y="208.0" class="lbl" text-anchor="middle" font-weight="600">High SD — scattered, unreliable</text><text x="160.0" y="232.0" class="sm" text-anchor="middle">every shot lands near the centre</text><text x="460.0" y="232.0" class="sm" text-anchor="middle">same aim, very different spread</text>
