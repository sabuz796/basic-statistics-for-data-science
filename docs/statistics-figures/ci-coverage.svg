="228.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="511.7" cy="228.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="308.9" cy="228.0" r="2.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.95"/><line x1="64.2" y1="238.0" x2="469.7" y2="238.0" class="ax" stroke="#0969da" stroke-width="2.4"/><circle cx="64.2" cy="238.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="469.7" cy="238.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="267.0" cy="238.0" r="2.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.95"/><line x1="121.8" y1="248.0" x2="527.3" y2="248.0" class="ax" stroke="#0969da" stroke-width="2.4"/><circle cx="121.8" cy="248.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="527.3" cy="248.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="324.6" cy="248.0" r="2.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.95"/><line x1="72.0" y1="258.0" x2="477.5" y2="258.0" class="ax" stroke="#0969da" stroke-width="2.4"/><circle cx="72.0" cy="258.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="477.5" cy="258.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="274.8" cy="258.0" r="2.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.95"/><line x1="78.6" y1="268.0" x2="484.2" y2="268.0" class="ax" stroke="#0969da" stroke-width="2.4"/><circle cx="78.6" cy="268.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="484.2" cy="268.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="281.4" cy="268.0" r="2.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.95"/><line x1="127.3" y1="278.0" x2="532.8" y2="278.0" class="ax" stroke="#0969da" stroke-width="2.4"/><circle cx="127.3" cy="278.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="532.8" cy="278.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="330.0" cy="278.0" r="2.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.95"/><line x1="126.6" y1="288.0" x2="532.2" y2="288.0" class="ax" stroke="#0969da" stroke-width="2.4"/><circle cx="126.6" cy="288.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="532.2" cy="288.0" r="2.7" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><circle cx="329.4" cy="288.0" r="2.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.95"/><text x="112.0" y="102.0" class="sm" text-anchor="end">CI #1</text><text x="112.0" y="288.0" class="sm" text-anchor="end">CI #20</text><circle cx="60.0" cy="350.0" r="3.2" fill="#0969da" stroke="none" stroke-width="1" opacity="1"/><text x="72.0" y="354.0" class="sm">covers the true mean</text><circle cx="300.0" cy="350.0" r="3.2" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><text x="312.0" y="354.0" class="sm">misses it (the 5% case)</text><text x="24.0" y="328.0" class="sm" fill="#1a7f37" font-weight="600">19 of 20 cover the truth — a 95% interval is BUILT to miss about 5% of the time.</text><text x="24.0" y="374.0" class="sm">The true mean is fixed; what varies is the interval your particular sample produces.</text>
