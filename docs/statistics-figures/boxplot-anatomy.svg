<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" width="640" height="338" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a box plot</title>
<desc id="d">A box plot showing min, Q1, median, Q3 and max, with the interquartile range highlighted.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="640" height="338" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">Reading a box plot</text><text x="24.0" y="48.0" class="sm">data:  2  4  4  4  5  5  7  9</text><line x1="272.0" y1="124.9" x2="176.0" y2="124.9" class="ax" stroke="#0969da"/><line x1="344.0" y1="108.5" x2="512.0" y2="108.5" class="ax" stroke="#0969da"/><line x1="176.0" y1="117.9" x2="176.0" y2="131.9" class="ax" stroke="#0969da" stroke-width="2.4"/><line x1="512.0" y1="101.5" x2="512.0" y2="115.5" class="ax" stroke="#0969da" stroke-width="2.4"/><rect x="272.0" y="108.5" width="72.0" height="16.4" fill="#ffffff" stroke="#0969da" stroke-width="2" opacity="1" rx="2"/><line x1="272.0" y1="119.5" x2="344.0" y2="119.5" class="ax" stroke="#0969da" stroke-width="3"/><line x1="80.0" y1="162.0" x2="560.0" y2="162.0" class="ax"/><line x1="176.0" y1="162.0" x2="176.0" y2="168.0" class="ax" stroke="#57606a"/><text x="176.0" y="184.0" class="sm" text-anchor="middle">min = 2</text><line x1="272.0" y1="162.0" x2="272.0" y2="188.0" class="ax" stroke="#57606a"/><text x="272.0" y="204.0" class="sm" text-anchor="middle">Q1 = 4</text><line x1="296.0" y1="162.0" x2="296.0" y2="168.0" class="ax" stroke="#57606a"/><text x="296.0" y="184.0" class="sm" text-anchor="middle">med = 4.5</text><line x1="344.0" y1="162.0" x2="344.0" y2="188.0" class="ax" stroke="#57606a"/><text x="344.0" y="204.0" class="sm" text-anchor="middle">Q3 = 5.5</text><line x1="512.0" y1="162.0" x2="512.0" y2="168.0" class="ax" stroke="#57606a"/><text x="512.0" y="184.0" class="sm" text-anchor="middle">max = 9</text><line x1="272.0" y1="58.0" x2="272.0" y2="52.0" class="ax" stroke="#bc4c00" stroke-width="1.6"/><line x1="344.0" y1="58.0" x2="344.0" y2="52.0" class="ax" stroke="#bc4c00" stroke-width="1.6"/><line x1="272.0" y1="52.0" x2="344.0" y2="52.0" class="ax" stroke="#bc4c00" stroke-width="1.6"/><text x="308.0" y="44.0" class="sm" text-anchor="middle" fill="#bc4c00">IQR = Q3 − Q1  (the middle 50%)</text><circle cx="34.0" cy="244.0" r="2.8" fill="#bc4c00" stroke="none" stroke-width="1" opacity="1"/><text x="46.0" y="248.0" class="sm">The box holds the middle 50% of the data.</text><circle cx="34.0" cy="268.0" r="2.8" fill="#bc4c00" stroke="none" stroke-width="1" opacity="1"/><text x="46.0" y="272.0" class="sm">The heavy line inside the box is the median.</text><circle cx="34.0" cy="292.0" r="2.8" fill="#bc4c00" stroke="none" stroke-width="1" opacity="1"/><text x="46.0" y="296.0" class="sm">Whiskers reach roughly 1.5 × IQR.</text><circle cx="34.0" cy="316.0" r="2.8" fill="#bc4c00" stroke="none" stroke-width="1" opacity="1"/><text x="46.0" y="320.0" class="sm">Points beyond the whiskers are outliers.</text>
</svg>
