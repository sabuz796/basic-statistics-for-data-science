<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 302" width="660" height="302" role="img" aria-labelledby="t d">
<title id="t">Residuals and why we square them</title>
<desc id="d">A scatter with the fitted line and grey vertical residual gaps, with the largest residual highlighted in orange to show why least squares squares the errors.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="660" height="302" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">Why we SQUARE the errors</text><text x="321.0" y="62.0" class="lbl" text-anchor="middle" font-weight="600">The vertical gaps are the residuals</text><line x1="96.0" y1="236.0" x2="546.0" y2="236.0" class="ax"/><line x1="96.0" y1="72.0" x2="96.0" y2="236.0" class="ax"/><line x1="96.0" y1="186.8" x2="546.0" y2="104.8" class="ax" stroke="#cf222e" stroke-width="2.4"/><text x="483.0" y="134.3" class="sm" text-anchor="end" fill="#cf222e" font-weight="600">fitted line</text><circle cx="96.0" cy="186.0" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="96.0" y1="186.8" x2="96.0" y2="186.0" class="ax" stroke="#d0d7de"/><circle cx="128.1" cy="172.0" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="128.1" y1="180.9" x2="128.1" y2="172.0" class="ax" stroke="#d0d7de"/><circle cx="160.3" cy="183.9" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="160.3" y1="175.1" x2="160.3" y2="183.9" class="ax" stroke="#d0d7de"/><circle cx="192.4" cy="162.5" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="192.4" y1="169.2" x2="192.4" y2="162.5" class="ax" stroke="#d0d7de"/><circle cx="224.6" cy="145.7" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="224.6" y1="163.4" x2="224.6" y2="145.7" class="ax" stroke="#d0d7de"/><circle cx="256.7" cy="149.6" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="256.7" y1="157.5" x2="256.7" y2="149.6" class="ax" stroke="#d0d7de"/><circle cx="288.9" cy="121.8" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="288.9" y1="151.7" x2="288.9" y2="121.8" class="ax" stroke="#d0d7de"/><circle cx="321.0" cy="162.7" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="321.0" y1="145.8" x2="321.0" y2="162.7" class="ax" stroke="#d0d7de"/><circle cx="353.1" cy="138.7" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="353.1" y1="139.9" x2="353.1" y2="138.7" class="ax" stroke="#d0d7de"/><circle cx="385.3" cy="147.6" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="385.3" y1="134.1" x2="385.3" y2="147.6" class="ax" stroke="#d0d7de"/><circle cx="417.4" cy="143.2" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="417.4" y1="128.2" x2="417.4" y2="143.2" class="ax" stroke="#d0d7de"/><circle cx="449.6" cy="125.9" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="449.6" y1="122.4" x2="449.6" y2="125.9" class="ax" stroke="#d0d7de"/><circle cx="481.7" cy="112.3" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="481.7" y1="116.5" x2="481.7" y2="112.3" class="ax" stroke="#d0d7de"/><circle cx="513.9" cy="102.6" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="513.9" y1="110.7" x2="513.9" y2="102.6" class="ax" stroke="#d0d7de"/><circle cx="546.0" cy="95.1" r="3.6" fill="#0969da" stroke="none" stroke-width="1" opacity="0.85"/><line x1="546.0" y1="104.8" x2="546.0" y2="95.1" class="ax" stroke="#d0d7de"/><line x1="288.9" y1="151.7" x2="288.9" y2="121.8" class="ax" stroke="#bc4c00" stroke-width="3"/><circle cx="288.9" cy="121.8" r="5.0" fill="#bc4c00" stroke="none" stroke-width="1" opacity="1"/><text x="280.9" y="111.8" class="sm" text-anchor="end" fill="#bc4c00" font-weight="600">largest residual</text><text x="24.0" y="276.0" class="sm">Squaring removes the sign, so errors above and below the line do not cancel out.</text><text x="24.0" y="294.0" class="sm">It also punishes a large miss harder — which is exactly what we want from a fit.</text>
</svg>
