<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d">
<title id="t">Correlation versus causation</title>
<desc id="d">A triangle diagram where cold weather causes both ice-cream sales and drownings, producing a spurious correlation between the two.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="680" height="300" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">A lurking third variable can create a perfect fake correlation</text><rect x="238.0" y="66.0" width="184.0" height="44.0" fill="#dbeafe" stroke="#0969da" stroke-width="1.8" opacity="1" rx="8"/><text x="330.0" y="96.0" class="lbl" text-anchor="middle" font-weight="600">Cold Weather</text><rect x="98.0" y="196.0" width="184.0" height="44.0" fill="#fff4e5" stroke="#bc4c00" stroke-width="1.8" opacity="1" rx="8"/><text x="190.0" y="224.0" class="lbl" text-anchor="middle" font-weight="600">Ice Cream</text><rect x="378.0" y="196.0" width="184.0" height="44.0" fill="#fee2e2" stroke="#cf222e" stroke-width="1.8" opacity="1" rx="8"/><text x="470.0" y="224.0" class="lbl" text-anchor="middle" font-weight="600">Drowning</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><line x1="284.0" y1="116.0" x2="176.0" y2="192.0" stroke="#bc4c00" stroke-width="2" marker-end="url(#ah)"/><path d="M182.6,182.2 L176.0,192.0 L187.4,189.1 Z" fill="#bc4c00"/><line x1="376.0" y1="116.0" x2="456.0" y2="192.0" stroke="#cf222e" stroke-width="2" marker-end="url(#ah)"/><path d="M445.1,187.5 L456.0,192.0 L450.9,181.4 Z" fill="#cf222e"/><text x="212.0" y="172.0" class="sm" text-anchor="middle" fill="#bc4c00" font-style="italic">causes</text><text x="448.0" y="172.0" class="sm" text-anchor="middle" fill="#cf222e" font-style="italic">causes</text><text x="24.0" y="288.0" class="sm">Ice-cream sales and drownings both rise in summer. The temperature causes both — there is no link between them.</text>
</svg>
