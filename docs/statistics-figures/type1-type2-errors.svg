<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img" aria-labelledby="t d">
<title id="t">Type I and Type II errors</title>
<desc id="d">A two-by-two decision table crossing the test decision with the true state, marking the Type I, Type II, correct and power cells.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="680" height="348" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">Every test is a trade-off between two kinds of mistake</text><text x="292.5" y="50.0" class="lbl" text-anchor="middle" fill="#cf222e" font-weight="600">H0 is FALSE</text><text x="497.5" y="50.0" class="lbl" text-anchor="middle" fill="#1a7f37" font-weight="600">H0 is TRUE</text><text x="292.5" y="118.0" class="lbl" text-anchor="middle" fill="#cf222e" font-weight="600">Type I error</text><text x="497.5" y="118.0" class="lbl" text-anchor="middle" fill="#1a7f37" font-weight="600">Correct</text><text x="176.0" y="118.0" class="sm" text-anchor="end" font-weight="600">Reject H0</text><text x="176.0" y="206.0" class="sm" text-anchor="end" font-weight="600">Fail to reject</text><rect x="194.0" y="88.0" width="197.0" height="80.0" fill="#cf222e" stroke="#cf222e" stroke-width="1.8" opacity="1" rx="6"/><text x="292.5" y="130.0" class="lbl" text-anchor="middle" fill="#ffffff" font-weight="600">alpha</text><text x="292.5" y="148.0" class="sm" text-anchor="middle" fill="#ffffff">false alarm</text><rect x="399.0" y="88.0" width="197.0" height="80.0" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.8" opacity="1" rx="6"/><text x="497.5" y="130.0" class="lbl" text-anchor="middle" fill="#ffffff" font-weight="600">1 - alpha</text><rect x="194.0" y="176.0" width="197.0" height="80.0" fill="#bc4c00" stroke="#bc4c00" stroke-width="1.8" opacity="1" rx="6"/><text x="292.5" y="218.0" class="lbl" text-anchor="middle" fill="#ffffff" font-weight="600">beta</text><text x="292.5" y="236.0" class="sm" text-anchor="middle" fill="#ffffff">missed a real effect</text><rect x="399.0" y="176.0" width="197.0" height="80.0" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.8" opacity="1" rx="6"/><text x="497.5" y="218.0" class="lbl" text-anchor="middle" fill="#ffffff" font-weight="600">power</text><text x="24.0" y="316.0" class="sm">A Type I error convicts an innocent defendant; a Type II error acquits a guilty one.</text><text x="24.0" y="336.0" class="sm">Choosing alpha = 0.05 means accepting a 5% chance of a Type I error, in advance.</text>
</svg>
