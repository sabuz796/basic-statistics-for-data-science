<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 292" width="700" height="292" role="img" aria-labelledby="t d">
<title id="t">How ANOVA sees a real difference</title>
<desc id="d">Two panels of box plots where the group means interleave versus one group being clearly separated, showing a large F statistic.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="700" height="292" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">ANOVA asks: is the between-group spread bigger than it should be?</text><text x="40.0" y="56.0" class="lbl" fill="#1a7f37" font-weight="600">H0 TRUE — all groups identical</text><line x1="40.0" y1="222.0" x2="330.0" y2="222.0" class="ax" stroke="#d0d7de"/><line x1="86.0" y1="193.3" x2="86.0" y2="162.2" class="ax" stroke="#1a7f37"/><line x1="60.0" y1="193.3" x2="112.0" y2="193.3" class="ax" stroke="#1a7f37"/><line x1="60.0" y1="162.2" x2="112.0" y2="162.2" class="ax" stroke="#1a7f37"/><rect x="61.0" y="171.1" width="50.0" height="7.9" fill="#ffffff" stroke="#1a7f37" stroke-width="2" opacity="1" rx="2"/><line x1="61.0" y1="179.0" x2="111.0" y2="179.0" class="ax" stroke="#1a7f37" stroke-width="2.6"/><text x="86.0" y="211.3" class="sm" text-anchor="middle" font-weight="600">A</text><line x1="166.0" y1="199.6" x2="166.0" y2="158.4" class="ax" stroke="#1a7f37"/><line x1="140.0" y1="199.6" x2="192.0" y2="199.6" class="ax" stroke="#1a7f37"/><line x1="140.0" y1="158.4" x2="192.0" y2="158.4" class="ax" stroke="#1a7f37"/><rect x="141.0" y="172.5" width="50.0" height="7.2" fill="#ffffff" stroke="#1a7f37" stroke-width="2" opacity="1" rx="2"/><line x1="141.0" y1="179.7" x2="191.0" y2="179.7" class="ax" stroke="#1a7f37" stroke-width="2.6"/><text x="166.0" y="217.6" class="sm" text-anchor="middle" font-weight="600">B</text><line x1="246.0" y1="214.7" x2="246.0" y2="159.0" class="ax" stroke="#1a7f37"/><line x1="220.0" y1="214.7" x2="272.0" y2="214.7" class="ax" stroke="#1a7f37"/><line x1="220.0" y1="159.0" x2="272.0" y2="159.0" class="ax" stroke="#1a7f37"/><rect x="221.0" y="175.1" width="50.0" height="5.7" fill="#ffffff" stroke="#1a7f37" stroke-width="2" opacity="1" rx="2"/><line x1="221.0" y1="180.8" x2="271.0" y2="180.8" class="ax" stroke="#1a7f37" stroke-width="2.6"/><text x="246.0" y="232.7" class="sm" text-anchor="middle" font-weight="600">C</text><text x="40.0" y="246.0" class="sm" fill="#57606a">F is small, p is large → fail to reject H0</text><text x="370.0" y="56.0" class="lbl" fill="#cf222e" font-weight="600">H0 FALSE — one group differs</text><line x1="370.0" y1="222.0" x2="660.0" y2="222.0" class="ax" stroke="#d0d7de"/><line x1="416.0" y1="193.3" x2="416.0" y2="162.2" class="ax" stroke="#cf222e"/><line x1="390.0" y1="193.3" x2="442.0" y2="193.3" class="ax" stroke="#cf222e"/><line x1="390.0" y1="162.2" x2="442.0" y2="162.2" class="ax" stroke="#cf222e"/><rect x="391.0" y="171.1" width="50.0" height="7.9" fill="#ffffff" stroke="#cf222e" stroke-width="2" opacity="1" rx="2"/><line x1="391.0" y1="179.0" x2="441.0" y2="179.0" class="ax" stroke="#cf222e" stroke-width="2.6"/><text x="416.0" y="211.3" class="sm" text-anchor="middle" font-weight="600">A</text><line x1="496.0" y1="199.6" x2="496.0" y2="158.4" class="ax" stroke="#cf222e"/><line x1="470.0" y1="199.6" x2="522.0" y2="199.6" class="ax" stroke="#cf222e"/><line x1="470.0" y1="158.4" x2="522.0" y2="158.4" class="ax" stroke="#cf222e"/><rect x="471.0" y="172.5" width="50.0" height="7.2" fill="#ffffff" stroke="#cf222e" stroke-width="2" opacity="1" rx="2"/><line x1="471.0" y1="179.7" x2="521.0" y2="179.7" class="ax" stroke="#cf222e" stroke-width="2.6"/><text x="496.0" y="217.6" class="sm" text-anchor="middle" font-weight="600">B</text><line x1="576.0" y1="131.4" x2="576.0" y2="85.4" class="ax" stroke="#cf222e"/><line x1="550.0" y1="131.4" x2="602.0" y2="131.4" class="ax" stroke="#cf222e"/><line x1="550.0" y1="85.4" x2="602.0" y2="85.4" class="ax" stroke="#cf222e"/><rect x="551.0" y="104.6" width="50.0" height="6.5" fill="#ffffff" stroke="#cf222e" stroke-width="2" opacity="1" rx="2"/><line x1="551.0" y1="111.1" x2="601.0" y2="111.1" class="ax" stroke="#cf222e" stroke-width="2.6"/><text x="576.0" y="149.4" class="sm" text-anchor="middle" font-weight="600">C</text><text x="370.0" y="246.0" class="sm" fill="#57606a">F is large, p is small → reject H0</text><text x="24.0" y="278.0" class="sm">Spread WITHIN groups is identical in both panels — only the spread BETWEEN the means differs. That is what F measures.</text>
</svg>
