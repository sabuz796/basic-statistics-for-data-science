<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 318" width="660" height="318" role="img" aria-labelledby="t d">
<title id="t">The least-squares line</title>
<desc id="d">A scatter of points with the least-squares regression line through them, minimising the sum of squared vertical residuals.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="660" height="318" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">The best-fit line is the one with the smallest squared error</text><line x1="76.0" y1="258.0" x2="546.0" y2="258.0" class="ax"/><line x1="76.0" y1="68.0" x2="76.0" y2="258.0" class="ax"/><line x1="76.0" y1="258.0" x2="76.0" y2="263.0" class="ax"/><text x="76.0" y="277.0" class="tick" text-anchor="middle">0</text><line x1="193.5" y1="258.0" x2="193.5" y2="263.0" class="ax"/><text x="193.5" y="277.0" class="tick" text-anchor="middle">0.25</text><line x1="311.0" y1="258.0" x2="311.0" y2="263.0" class="ax"/><text x="311.0" y="277.0" class="tick" text-anchor="middle">0.5</text><line x1="428.5" y1="258.0" x2="428.5" y2="263.0" class="ax"/><text x="428.5" y="277.0" class="tick" text-anchor="middle">0.75</text><line x1="546.0" y1="258.0" x2="546.0" y2="263.0" class="ax"/><text x="546.0" y="277.0" class="tick" text-anchor="middle">1</text><line x1="76.0" y1="123.9" x2="546.0" y2="85.9" class="ax" stroke="#cf222e" stroke-width="2.4"/><text x="311.0" y="69.1" class="sm" text-anchor="middle" fill="#cf222e" font-weight="600">least-squares line</text><circle cx="76.0" cy="135.4" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="115.2" cy="118.0" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="154.3" cy="101.6" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="193.5" cy="95.5" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="232.7" cy="96.7" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="271.8" cy="107.5" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="311.0" cy="100.8" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="350.2" cy="104.7" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="389.3" cy="114.6" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="428.5" cy="101.1" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="467.7" cy="80.6" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="506.8" cy="86.0" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="546.0" cy="89.8" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><text x="311.0" y="288.0" class="sm" text-anchor="middle" fill="#57606a">x</text><text x="60.0" y="62.0" class="sm" text-anchor="middle" fill="#57606a">y</text><text x="24.0" y="306.0" class="sm">The model y = b0 + b1*x + e picks b0 and b1 to make the SUM of the squared residuals as small as possible.</text>
