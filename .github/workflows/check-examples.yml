name: Check examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # weekly, so dependency drift that breaks the book's code is caught early
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-blocks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python3 check_examples.py
