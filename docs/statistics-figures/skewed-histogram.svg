m" text-anchor="middle" fill="#57606a">value (e.g. monthly charges)</text><text x="56.0" y="164.0" class="sm" text-anchor="middle" fill="#57606a">frequency</text><line x1="98.2" y1="74.0" x2="98.2" y2="254.0" class="ax" stroke="#1a7f37" stroke-width="2.2"/><text x="104.2" y="90.0" class="sm" fill="#1a7f37" font-weight="600">median</text><line x1="140.9" y1="74.0" x2="140.9" y2="254.0" class="ax" stroke="#cf222e" stroke-width="2.2"/><text x="134.9" y="108.0" class="sm" text-anchor="end" fill="#cf222e" font-weight="600">mean</text><text x="24.0" y="300.0" class="sm">The mean is pulled into the tail, so ‘average’ overstates a typical value. Use the median and the IQR.</text>
