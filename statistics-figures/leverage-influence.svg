<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" width="680" height="292" role="img" aria-labelledby="t d">
<title id="t">Leverage and influence</title>
<desc id="d">A scatter with a fitted line and two highlighted points, one with a large residual and one isolated in x with high leverage.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="680" height="292" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">One point can be doing a lot of the talking</text><line x1="84.0" y1="248.0" x2="584.0" y2="248.0" class="ax"/><line x1="84.0" y1="68.0" x2="84.0" y2="248.0" class="ax"/><line x1="106.7" y1="248.0" x2="106.7" y2="253.0" class="ax"/><text x="106.7" y="267.0" class="tick" text-anchor="middle">-1</text><line x1="334.0" y1="248.0" x2="334.0" y2="253.0" class="ax"/><text x="334.0" y="267.0" class="tick" text-anchor="middle">0</text><line x1="561.3" y1="248.0" x2="561.3" y2="253.0" class="ax"/><text x="561.3" y="267.0" class="tick" text-anchor="middle">1</text><line x1="106.7" y1="219.2" x2="561.3" y2="156.8" class="ax" stroke="#d0d7de"/><line x1="334.0" y1="188.0" x2="561.3" y2="156.8" class="ax" stroke="#cf222e" stroke-width="2.4"/><text x="484.0" y="120.8" class="sm" text-anchor="middle" fill="#cf222e" font-weight="600">fitted line</text><circle cx="334.0" cy="188.6" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="356.7" cy="173.9" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="379.5" cy="187.4" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="402.2" cy="191.5" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="424.9" cy="173.5" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="447.6" cy="167.6" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="470.4" cy="166.2" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="493.1" cy="162.1" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="515.8" cy="163.4" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="538.5" cy="163.7" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="561.3" cy="161.7" r="3.4" fill="#0969da" stroke="none" stroke-width="1" opacity="0.8"/><circle cx="543.1" cy="209.7" r="5.2" fill="#bc4c00" stroke="none" stroke-width="1" opacity="0.9"/><text x="553.1" y="213.7" class="sm" fill="#bc4c00" font-weight="600">high residual</text><circle cx="118.1" cy="143.2" r="5.2" fill="#bc4c00" stroke="none" stroke-width="1" opacity="0.9"/><text x="108.1" y="139.2" class="sm" text-anchor="end" fill="#bc4c00" font-weight="600">high leverage</text><text x="24.0" y="278.0" class="sm">Leverage = how isolated the point is in x. Influence = how much the fit moves if you delete it. Check both.</text>
</svg>
