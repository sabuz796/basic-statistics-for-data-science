<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" role="img" aria-labelledby="t d">
<title id="t">Breakdown point of the mean versus the median</title>
<desc id="d">Two panels showing that a single corrupted value destroys the mean, while more than half the data must be corrupted to destroy the median.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
  .ttl{font-size:15px;font-weight:600}
  .lbl{font-size:12px}
  .sm{font-size:11px;fill:#57606a}
  .ax{stroke:#57606a;stroke-width:1.2}
  .gr{stroke:#d0d7de;stroke-width:1;stroke-dasharray:3 3}
  .tick{font-size:11px;fill:#57606a}
</style>
<rect width="760" height="306" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker></defs><text x="24.0" y="26.0" class="ttl">How much corruption can a statistic absorb?</text><text x="24.0" y="58.0" class="lbl" fill="#cf222e" font-weight="600">MEAN</text><line x1="60.0" y1="96.0" x2="300.0" y2="96.0" class="ax" stroke="#57606a"/><line x1="80.0" y1="96.0" x2="80.0" y2="150.0" class="ax" stroke="#d0d7de"/><line x1="100.0" y1="96.0" x2="100.0" y2="150.0" class="ax" stroke="#d0d7de"/><line x1="120.0" y1="96.0" x2="120.0" y2="150.0" class="ax" stroke="#d0d7de"/><rect x="70.0" y="96.0" width="60.0" height="74.0" fill="#fee2e2" stroke="#cf222e" stroke-width="2" opacity="1" rx="3"/><circle cx="280.0" cy="74.0" r="6.0" fill="#cf222e" stroke="none" stroke-width="1" opacity="1"/><text x="280.0" y="60.0" class="sm" text-anchor="middle" fill="#cf222e" font-weight="600">one bad value</text><text x="24.0" y="206.0" class="sm" fill="#cf222e" font-weight="600">breakdown point = 0%</text><text x="24.0" y="226.0" class="sm">one corrupted point is enough</text><text x="380.0" y="58.0" class="lbl" fill="#1a7f37" font-weight="600">MEDIAN</text><line x1="400.0" y1="96.0" x2="660.0" y2="96.0" class="ax" stroke="#57606a"/><rect x="410.0" y="96.0" width="240.0" height="74.0" fill="#dcfce7" stroke="#1a7f37" stroke-width="2" opacity="1" rx="3"/><line x1="425.0" y1="96.0" x2="425.0" y2="170.0" class="ax" stroke="#1a7f37"/><line x1="451.0" y1="96.0" x2="451.0" y2="170.0" class="ax" stroke="#1a7f37"/><line x1="477.0" y1="96.0" x2="477.0" y2="170.0" class="ax" stroke="#1a7f37"/><line x1="503.0" y1="96.0" x2="503.0" y2="170.0" class="ax" stroke="#1a7f37"/><line x1="529.0" y1="96.0" x2="529.0" y2="170.0" class="ax" stroke="#1a7f37"/><line x1="555.0" y1="96.0" x2="555.0" y2="170.0" class="ax" stroke="#1a7f37"/><line x1="581.0" y1="96.0" x2="581.0" y2="170.0" class="ax" stroke="#1a7f37"/><line x1="607.0" y1="96.0" x2="607.0" y2="170.0" class="ax" stroke="#1a7f37"/><line x1="633.0" y1="96.0" x2="633.0" y2="170.0" class="ax" stroke="#1a7f37"/><text x="515.0" y="60.0" class="sm" text-anchor="middle" fill="#1a7f37" font-weight="600">you must corrupt more than half</text><text x="380.0" y="206.0" class="sm" fill="#1a7f37" font-weight="600">breakdown point = 50%</text><text x="380.0" y="226.0" class="sm">most of the data must be corrupted</text><text x="24.0" y="272.0" class="sm">This is why the median survives an outlier and the mean does not — and it is the formal version of the salary story.</text><text x="24.0" y="292.0" class="sm">Robustness costs a little efficiency. Buy the insurance when your data is genuinely suspect.</text>
</svg>
